spring.application.name=hospital-manager

# Default local profile persists data to an embedded database without requiring MySQL.
spring.datasource.url=jdbc:h2:file:./data/hospital_manager;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.defer-datasource-initialization=true

app.jwt.secret=change-this-to-a-long-random-secret-value-for-production
app.jwt.expiration-ms=3600000
