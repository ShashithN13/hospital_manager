spring.application.name=hospital-manager

# Default local profile uses an embedded database so the app can start cleanly
# without a real MySQL server during local build/test validation.
spring.datasource.url=jdbc:h2:mem:hospital_manager;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.defer-datasource-initialization=true

app.jwt.secret=change-this-to-a-long-random-secret-value-for-production
app.jwt.expiration-ms=3600000
